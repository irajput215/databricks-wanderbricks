# The end-to-end daily forecasting job:
#   ingest -> DLT pipeline (clean + features) -> baseline -> train -> score
# See README Part 2, steps 8 and 10 (orchestration + retraining loop).

resources:
  jobs:
    forecasting_job:
      name: forecasting-job

      trigger:
        # Run every day; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      email_notifications:
        on_failure:
          - iraonfridays@gmail.com

      # Serverless-only workspace: no job_clusters. Python tasks run on
      # serverless compute with an environment spec for dependencies.
      environments:
        - environment_key: forecast_ml
          spec:
            environment_version: "4"
            dependencies:
              - prophet
              - xgboost
              - scikit-learn

      tasks:
        - task_key: ingest
          environment_key: forecast_ml
          spark_python_task:
            python_file: ../pipelines/01_ingest.py

        - task_key: dlt_pipeline
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.forecasting_pipeline.id}

        - task_key: baseline
          environment_key: forecast_ml
          depends_on:
            - task_key: dlt_pipeline
          spark_python_task:
            python_file: ../ml/04_baseline.py

        - task_key: train
          environment_key: forecast_ml
          depends_on:
            - task_key: dlt_pipeline
          spark_python_task:
            python_file: ../ml/05_train_xgb.py

        - task_key: score
          environment_key: forecast_ml
          depends_on:
            - task_key: train
          spark_python_task:
            python_file: ../ml/06_score.py

      # Retraining loop (README Part 2, step 10): add a task that compares
      # forecast error vs. threshold and conditionally retrains/promotes,
      # e.g. via `if: "{{ ... }}"` job-cluster conditions or a separate
      # "retrain_on_drift" job triggered by a monitor alert.
