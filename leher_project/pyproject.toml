[project]
name = "leher-demo"
version = "0.1.0"
description = "Leher data-platform demo: API -> raw lake -> unified farm daily table (Databricks + local DuckDB mirror)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E4/E7/E9 + formatter = the ruff-recommended set (line length is the formatter's job).
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Pipeline functions use the `spark` session injected by the Databricks pipeline runtime.
"pipelines/**/*.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
