# Declarative Automation Bundle for the Databricks end-to-end forecasting project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks-forecasting
  uuid: b2069324-370a-4d04-8f83-9751561eb260

include:
  - resources/*.yml

# Artifacts (uncomment once the project is packaged as a wheel):
# artifacts:
#   python_artifact:
#     type: whl
#     build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-2944edfb-cd25.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-2944edfb-cd25.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/iraonfridays@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/iraonfridays@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: iraonfridays@gmail.com
        level: CAN_MANAGE
